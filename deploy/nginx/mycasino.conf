# Blue-green nginx config for the mycasino Telegram bot.
#
# Two upstream pools, "blue" and "green", each backed by a single
# bot instance.  At any given moment the public location
# /bot_webhook proxies to whichever upstream is symlinked to
# `mycasino_active` -- the blue_green_switch.sh script flips that
# symlink atomically and reloads nginx with `nginx -s reload` (which
# is itself zero-downtime: workers finish in-flight requests before
# being recycled).
#
#   1. nginx config tests:  sudo nginx -t
#   2. zero-downtime reload: sudo nginx -s reload
#   3. flip blue<->green:    deploy/blue_green_switch.sh
#
# The bot listens on port 8000 (blue) or 8001 (green); the side-car
# health server runs at port+1000 (9000 / 9001) and is what nginx
# probes via active_health below (NGINX Plus) or the periodic curl
# loop in deploy/blue_green_switch.sh on stock nginx.

upstream mycasino_blue {
    server 127.0.0.1:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream mycasino_green {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# The "active" upstream is selected via a map driven by a file the
# blue_green_switch.sh script rewrites.  This avoids the need for a
# symlink dance inside conf.d.
map $mycasino_active_color $mycasino_active_upstream {
    default       mycasino_blue;
    "blue"        mycasino_blue;
    "green"       mycasino_green;
}

# /etc/nginx/active_color.conf contains a single line:
#     set $mycasino_active_color "blue";
# (or "green").  The script atomically rewrites it, then reloads nginx.

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # Telegram only sends POSTs to /bot_webhook -- limit body size to
    # match Bot API (currently <= 1 MB but allow some headroom).
    client_max_body_size 8m;

    include /etc/nginx/active_color.conf;

    # Telegram webhook endpoint -- proxied to the active color.
    location = /bot_webhook {
        if ($request_method !~ ^(POST)$) { return 405; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$mycasino_active_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Public health that always reflects the ACTIVE bot (so external
    # uptime monitors can probe it).
    location = /healthz {
        proxy_pass http://$mycasino_active_upstream:9000/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Admin-only routes for inspecting blue vs green directly.
    location = /healthz/blue  { proxy_pass http://127.0.0.1:9000/healthz; allow 127.0.0.1; deny all; }
    location = /healthz/green { proxy_pass http://127.0.0.1:9001/healthz; allow 127.0.0.1; deny all; }
    location = /readyz/blue   { proxy_pass http://127.0.0.1:9000/readyz;  allow 127.0.0.1; deny all; }
    location = /readyz/green  { proxy_pass http://127.0.0.1:9001/readyz;  allow 127.0.0.1; deny all; }
}
